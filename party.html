<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BattleClock — Party View Diagnostic</title>
<style>:root{color-scheme:dark;--bg:#15171a;--panel:#24282d;--text:#f3f4f6;--muted:#aeb4bd;--border:#444b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}main{max-width:1400px;margin:auto;padding:20px}h1{margin:0;font-size:22px}.sub,.status{color:var(--muted);font-size:12px}.live{color:#8de5a1}.bad{color:#ffaaaa}#players,#entities{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:16px}.card{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:15px}.name{font-size:19px;font-weight:900}.clock{text-align:center;font-size:clamp(54px,8vw,92px);font-weight:900;margin:14px 0;background:#101214;border-radius:13px;padding:12px}.empty{color:var(--muted);padding:20px 0;line-height:1.5}.error{background:#351d1d;border:1px solid #7a4141;border-radius:12px;padding:14px;color:#ffd0d0;line-height:1.5}h2{font-size:18px;margin:28px 0 12px}@media(max-width:760px){#players,#entities{grid-template-columns:1fr}}</style></head>
<body><header><div><h1>BattleClock</h1><div class="sub">Party View · read only · diagnostic build</div></div><div id="status" class="status">STARTING…</div></header><main><section id="players"><div class="empty">Starting Party View…</div></section><h2>Visible Session Entities</h2><section id="entities"></section></main>
<script>
const U="https://ljqkmbngpdvgwfzgbmxp.supabase.co",K="sb_publishable_IwmRcJDgcBD40snvuUgN6g_Uct68Vvn",S="main";
const st=document.getElementById("status"),ps=document.getElementById("players"),es=document.getElementById("entities");let state=null,received=Date.now();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")};
function status(t,c=""){st.textContent=t;st.className="status "+c}function fail(m){status("LOAD ERROR","bad");ps.innerHTML=`<div class="error"><strong>Party View connection failed.</strong><br><br>${esc(m)}<br><br>Send this exact message to the DM.</div>`}
function cur(p){let n=Math.max(0,Number(p.remaining)||0);return p.running?Math.max(0,n-(Date.now()-received)/1000*(Number(p.rate)||1)):n}
function render(){if(!Array.isArray(state?.players)){ps.innerHTML='<div class="empty">Connected to Supabase, but the DM has not published a player snapshot yet.</div>';es.innerHTML="";return}ps.innerHTML=state.players.map(p=>`<article class="card" style="border-color:${esc(p.color||"#444b55")}"><div class="name">${esc(p.name)}</div><div class="sub">${p.running?"● RUNNING":"STOPPED"}</div><div class="clock" data-player="${esc(p.id)}">${fmt(cur(p))}</div></article>`).join("");let a=Array.isArray(state.entities)?state.entities:[];es.innerHTML=a.length?a.map(e=>`<article class="card"><div class="name">${esc(e.name)}</div><div class="sub">${esc(e.type)}${e.type==="Mob"?` · ×${Number(e.quantity)||1}`:""}</div></article>`).join(""):'<div class="empty">No public entities currently in play.</div>'}
async function load(){status(state?"● LIVE · REFRESHING":"CONTACTING SUPABASE…",state?"live":"");const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const q=`${U}/rest/v1/battleclock_sessions?session_id=eq.${encodeURIComponent(S)}&select=public_state,updated_at`;const r=await fetch(q,{headers:{apikey:K,Authorization:"Bearer "+K,Accept:"application/json"},cache:"no-store",signal:c.signal});const raw=await r.text();if(!r.ok)throw new Error(`Supabase HTTP ${r.status}: ${raw.slice(0,500)}`);const rows=JSON.parse(raw);if(!Array.isArray(rows)||!rows.length)throw new Error("Session 'main' was not returned.");state=rows[0].public_state||{};received=Number(state.published_at)||Date.now();status("● LIVE","live");render()}catch(e){fail(e?.name==="AbortError"?"Supabase request timed out after 8 seconds.":e?.message||String(e))}finally{clearTimeout(t)}}
load();setInterval(()=>{if(document.visibilityState==="visible")load()},3000);setInterval(()=>{if(!state?.players)return;for(const p of state.players){const e=document.querySelector(`[data-player="${CSS.escape(String(p.id))}"]`);if(e)e.textContent=fmt(cur(p))}},250);
</script></body></html>
