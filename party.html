<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BattleClock — Party View v0.7.2</title>
<style>:root{color-scheme:dark;--bg:#0b0e12;--panel:#171c23;--text:#f6f7f9;--muted:#9da8b5;--border:#303945;--green:#8de5a1}*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:var(--text);font-family:system-ui,sans-serif}header{padding:10px 18px;background:#0d1117;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}main{max-width:1600px;margin:auto;padding:12px}h1{margin:0;font-size:20px}.sub,.status{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}button,input,select{background:#151b22;color:#fff;border:1px solid #3b4651;border-radius:7px;padding:7px}button{cursor:pointer;font-weight:800}.primary{background:#244f35}.danger{background:#512929}.login{display:flex;gap:6px;align-items:center}#players{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:9px}.card{background:#171c23;border:1px solid var(--border);border-radius:12px;padding:10px}.player{border-left:4px solid var(--pc,#55e08a)}.name{font-size:17px;font-weight:900}.clock{font:900 40px ui-monospace,monospace;background:#090c10;border-radius:8px;padding:6px;text-align:center;margin:5px 0}.turn{padding:5px;text-align:center;border-radius:7px;font-size:10px;font-weight:900}.turn.active{background:#173b28;color:#9df0b4}.turn.passive{background:#453619;color:#ffd37a}.actions{display:grid;gap:5px;margin-top:7px}.action{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;background:#10151b;border:1px solid #2c3540;border-radius:8px;padding:6px}.action small{display:block;color:var(--muted)}.section{margin:16px 0 7px;font-size:12px;font-weight:900;text-transform:uppercase}.entities{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:8px}.hp{display:grid;grid-template-columns:25px 1fr 52px;gap:5px;align-items:center;font-size:9px;margin:4px 0}.track{height:7px;background:#0a0d11;border-radius:99px;overflow:hidden}.fill{height:100%;background:#43d17a}.empty{color:var(--muted);padding:12px;border:1px dashed var(--border);border-radius:9px}dialog{background:#151b22;color:#fff;border:1px solid #3b4651;border-radius:12px}#claimBox{margin-bottom:10px;padding:8px;border:1px solid #303945;border-radius:9px}.mine{box-shadow:0 0 0 2px #8de5a155}</style></head>
<body><header><div><h1>BattleClock</h1><div class="sub">Party View · v0.7.4 · desktop tabletop dashboard</div></div><div class="login"><span id="status" class="status">CONNECTING…</span></div></header>
<main><div id="claimBox"><b>PLAYER PROFILE</b> <select id="playerSelect"><option value="">Choose your player…</option></select> <button id="claimBtn" class="primary">USE THIS PLAYER</button> <button id="changeBtn" type="button" style="display:none">CHANGE PLAYER</button> <span id="who" class="sub"></span></div><section id="players"></section><div class="section">Upcoming</div><section id="timeline"></section><div class="section">Session Entities</div><section id="entities" class="entities"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U="https://ljqkmbngpdvgwfzgbmxp.supabase.co",K="sb_publishable_IwmRcJDgcBD40snvuUgN6g_Uct68Vvn",S="main",sb=supabase.createClient(U,K);let state=null,received=Date.now(),myPlayer=localStorage.getItem("battleClock_my_player_v074")||null;
const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")};
function age(){return(Date.now()-received)/1000}function ptime(p){return p.running?Math.max(0,p.remaining-age()*(p.rate||1)):p.remaining}function etime(e){return e.running?Math.max(0,e.remaining-age()):e.remaining}
async function load(){try{const r=await fetch(`${U}/rest/v1/battleclock_sessions?session_id=eq.${S}&select=public_state`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const a=await r.json();state=a[0]?.public_state||{};received=Number(state.published_at)||Date.now();$("status").textContent="● LIVE";render();loadAvailablePlayers()}catch(e){$("status").textContent="LOAD ERROR"}}
function render(){const ps=state?.players||[];if(!$("playerSelect").options.length)$("playerSelect").innerHTML=ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");if(myPlayer)$("playerSelect").value=myPlayer;
$("players").innerHTML=ps.map(p=>{const mine=p.id===myPlayer;return `<article class="card player ${mine?"mine":""}" style="--pc:${esc(p.color)}"><div class="name">${esc(p.name)}</div><div class="sub">${p.running?"● RUNNING":"STOPPED"} · ${Math.round((p.rate||1)*100)}% RATE</div><div class="turn ${p.turnState==="passive"?"passive":"active"}">${Math.round((p.rate||1)*100)}%</div><div class="clock" data-p="${esc(p.id)}">${fmt(ptime(p))}</div>${mine?`<button onclick="setTurn('${esc(p.id)}','${p.turnState==="active"?"passive":"active"}')">${p.turnState==="active"?"END MY TURN":"MY TURN"}</button>`:""}<div class="actions">${(p.actions||[]).map(a=>`<div class="action"><div><b>${esc(a.kind)} · ${esc(a.name)}</b><small>${esc(a.reference||"")}${a.timeCost?` · ${a.timeCost}s cost`:""}${a.cooldownRemaining>0?` · CD <span data-pcd="${esc(p.id)}:${esc(a.id)}">${fmt(a.cooldownRemaining)}</span>`:""}</small></div>${mine?`<button ${a.cooldownRemaining>0||((a.maxUses!==""&&a.maxUses!=null)&&Number(a.currentUses)<=0)?"disabled":""} onclick="useAction('${esc(p.id)}','${esc(a.id)}')">USE</button>`:""}</div>`).join("")}</div></article>`}).join("");
const tl=state?.timeline||[];$("timeline").innerHTML=tl.length?tl.map(x=>`<div class="card"><b>${esc(x.name)}</b> · <span data-e="${esc(x.id)}">${x.due?"DUE":fmt(etime(x))}</span></div>`).join(""):'<div class="empty">No public encounter events.</div>';
const es=state?.entities||[];$("entities").innerHTML=es.length?es.map(e=>`<article class="card"><div class="name">${esc(e.name)}</div><div class="sub">${esc(e.type)}${e.type==="Mob"?` · ×${e.quantity}`:""}</div>${e.type==="Mob"?(e.mobHP||[]).map((h,i)=>`<div class="hp"><b>#${i+1}</b><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,h/(e.mobHPMax||1)*100))}%"></div></div><span>${h<=0?"DOWN":h+"/"+e.mobHPMax}</span></div>`).join(""):""}${e.initiative?.interval?`<div class="sub">NEXT ACTION · <span data-mi="${esc(e.id)}">${e.initiative.running?fmt(Math.max(0,e.initiative.remaining-age())):fmt(e.initiative.remaining)}</span></div>`:""}</article>`).join(""):'<div class="empty">No public entities.</div>'}
async function ensureControlRow(pid){
 const player=(state?.players||[]).find(p=>p.id===pid);
 const {error}=await sb.from("battleclock_player_controls").upsert({
   session_id:S,player_id:pid,
   turn_state:player?.turnState||"active",updated_at:new Date().toISOString()
 },{onConflict:"session_id,player_id"});
 if(error)throw error
}
async function setTurn(pid,turn){
 if(!myPlayer||pid!==myPlayer)return;
 try{await ensureControlRow(pid);const {error}=await sb.from("battleclock_player_controls").update({turn_state:turn,updated_at:new Date().toISOString()}).eq("session_id",S).eq("player_id",pid);if(error)throw error}
 catch(error){alert("Could not update turn: "+error.message)}
}
async function useAction(pid,aid){
 if(!myPlayer||pid!==myPlayer)return;
 const req={action_id:aid,nonce:crypto.randomUUID(),at:Date.now()};
 try{await ensureControlRow(pid);const {error}=await sb.from("battleclock_player_controls").update({action_request:req,updated_at:new Date().toISOString()}).eq("session_id",S).eq("player_id",pid);if(error)throw error}
 catch(error){alert("Could not use action: "+error.message)}
}
function updateProfileUI(){
 const player=(state?.players||[]).find(p=>p.id===myPlayer);
 if(myPlayer&&player){
   $("who").textContent="CONTROLLING "+player.name;
   $("playerSelect").value=myPlayer;$("playerSelect").disabled=true;
   $("claimBtn").style.display="none";$("changeBtn").style.display="";
 }else{
   if(myPlayer){myPlayer=null;localStorage.removeItem("battleClock_my_player_v074")}
   $("who").textContent="";$("playerSelect").disabled=false;
   $("claimBtn").style.display="";$("changeBtn").style.display="none";
 }
}
function loadAvailablePlayers(){
 if(!state)return;
 const ps=state.players||[],current=$("playerSelect").value;
 $("playerSelect").innerHTML='<option value="">Choose your player…</option>'+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
 $("playerSelect").value=myPlayer||current||"";updateProfileUI()
}
async function choosePlayer(){
 const pid=$("playerSelect").value;if(!pid)return;
 const player=(state?.players||[]).find(p=>p.id===pid);if(!player)return;
 try{await ensureControlRow(pid);myPlayer=pid;localStorage.setItem("battleClock_my_player_v074",pid);updateProfileUI();render()}
 catch(error){alert("Could not select player: "+error.message)}
}
function changePlayer(){
 myPlayer=null;localStorage.removeItem("battleClock_my_player_v074");updateProfileUI();render()
}
$("claimBtn").onclick=choosePlayer;$("changeBtn").onclick=changePlayer;
load();setInterval(load,2000);setInterval(()=>{if(!state)return;(state.players||[]).forEach(p=>{const x=document.querySelector(`[data-p="${CSS.escape(String(p.id))}"]`);if(x)x.textContent=fmt(ptime(p))});(state.timeline||[]).forEach(e=>{const x=document.querySelector(`[data-e="${CSS.escape(String(e.id))}"]`);if(x)x.textContent=etime(e)<=0?"DUE":fmt(etime(e))});(state.entities||[]).forEach(e=>{if(e.initiative?.interval){const x=document.querySelector(`[data-mi="${CSS.escape(String(e.id))}"]`);if(x){const v=e.initiative.running?Math.max(0,e.initiative.remaining-age()):e.initiative.remaining;x.textContent=v<=0?"DUE":fmt(v)}}})},250);
</script></body></html>
