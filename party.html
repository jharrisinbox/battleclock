<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BattleClock — Party View v0.5</title>
<style>:root{color-scheme:dark;--bg:#0b0e12;--panel:#171c23;--text:#f6f7f9;--muted:#9da8b5;--border:#303945;--green:#8de5a1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#24303d 0,#0b0e12 46%);color:var(--text);font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:4;padding:14px 22px;background:#0d1117ee;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}main{max-width:1500px;margin:auto;padding:20px}h1{margin:0;font-size:22px}.sub,.status{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.status{padding:7px 10px;border:1px solid var(--border);border-radius:999px}.live{color:var(--green)}#players{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}.card{background:linear-gradient(145deg,#202731,#151a20);border:1px solid var(--border);border-radius:17px;padding:14px;box-shadow:0 12px 30px #0005}.player{border-left:5px solid var(--pc,#55e08a)}.name{font-size:19px;font-weight:900}.clock{text-align:center;font:900 clamp(58px,8vw,100px) ui-monospace,monospace;background:#090c10;border-radius:13px;padding:14px;margin:12px 0}.chips{min-height:20px;text-align:center}.chip{display:inline-block;padding:3px 7px;border:1px solid #59636f;border-radius:999px;font-size:10px;margin:2px}.section{margin:25px 0 10px;font-size:14px;letter-spacing:1px;text-transform:uppercase}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.event.due{border-color:#a84848}.eventclock{font:900 25px ui-monospace,monospace}.entities{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px}.comp{margin-top:8px;padding:8px;background:#0e1217;border:1px solid #29313a;border-radius:9px}.compname{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900}.compval{font-size:20px;font-weight:900}.empty{color:var(--muted);padding:18px;border:1px dashed var(--border);border-radius:12px}.bad{color:#ffaaaa}@media(max-width:800px){#players,.entities{grid-template-columns:1fr}}.turn{font-size:10px;font-weight:900;margin-top:4px}.turn.active{color:#8de5a1}.turn.passive{color:#ffd37a}.cds{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.cd{font-size:9px;border:1px solid #3b4651;border-radius:999px;padding:2px 5px}.mobhps{margin-top:7px}.mobhp{display:grid;grid-template-columns:24px 1fr 48px;gap:5px;align-items:center;margin:4px 0;font-size:9px}.hpbar{height:7px;background:#11161b;border-radius:99px;overflow:hidden}.hpfill{height:100%;background:#43d17a}</style></head>

<script>

function age(){return (Date.now()-received)/1000}function ptime(p){return p.running?Math.max(0,p.remaining-age()*(p.rate||1)):p.remaining}function ttime(t){return t.running?Math.max(0,t.remaining-age()*(t.rate||1)):t.remaining}function etime(e){return e.running?Math.max(0,e.remaining-age()):e.remaining}
function render(){const ps=state?.players||[];$("players").innerHTML=ps.length?ps.map(p=>`<article class="card player" style="--pc:${esc(p.color)}"><div class="name">${esc(p.name)}</div><div class="sub">${p.running?"● RUNNING":"STOPPED"}</div><div class="turn ${p.turnState==="passive"?"passive":"active"}">${p.turnState==="passive"?"PASSIVE · NOT MY TURN":"ACTIVE · MY TURN"}</div><div class="clock" data-p="${esc(p.id)}">${fmt(ptime(p))}</div><div class="cds">${(p.cooldowns||[]).map(c=>`<span class="cd">${esc(c.name)}: ${Number(c.remaining)<=0?"READY":fmt(c.remaining)}</span>`).join("")}</div><div class="chips">${(p.effects||[]).map(x=>`<span class="chip">${esc(x.name)}</span>`).join("")}</div></article>`).join(""):'<div class="empty">Waiting for player clocks…</div>';
const tl=state?.timeline||[];$("timeline").innerHTML=tl.length?tl.map(x=>`<article class="card event ${x.due?"due":""}"><div><div class="name">${esc(x.name)}</div><div class="sub">${x.repeat?"Repeats every "+fmt(x.interval):"One-time event"}</div></div><div class="eventclock" data-e="${esc(x.id)}">${x.due?"DUE":fmt(etime(x))}</div></article>`).join(""):'<div class="empty">No public encounter events.</div>';
const es=state?.entities||[];$("entities").innerHTML=es.length?es.map(e=>`<article class="card"><div class="name">${esc(e.name)}</div><div class="sub">${esc(e.type)}${e.type==="Mob"?" · ×"+(e.quantity||1):""}</div>${(e.components||[]).map(c=>`<div class="comp"><div class="compname">${esc(c.name)}</div><div class="compval" data-ent="${esc(e.id)}" data-c="${esc(c.id)}">${c.kind==="timer"?fmt(ttime(c)):c.kind==="resource"?esc(c.value)+" / "+esc(c.max):esc(c.value)}</div></div>`).join("")}</article>`).join(""):'<div class="empty">No public entities currently in play.</div>'}
async function load(){try{const r=await fetch(`${U}/rest/v1/battleclock_sessions?session_id=eq.${S}&select=public_state`,{headers:{apikey:K,Authorization:"Bearer "+K},cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const a=await r.json();if(!a.length)throw new Error("Session main missing");state=a[0].public_state||{};received=Number(state.published_at)||Date.now();$("status").textContent=state.globalPaused?"■ PAUSED":"● LIVE";$("status").className="status live";render()}catch(e){$("status").textContent="LOAD ERROR";$("status").className="status bad";console.error(e)}}
load();setInterval(load,3000);setInterval(()=>{if(!state)return;(state.players||[]).forEach(p=>{let x=document.querySelector(`[data-p="${CSS.escape(String(p.id))}"]`);if(x)x.textContent=fmt(ptime(p))});(state.timeline||[]).forEach(e=>{let x=document.querySelector(`[data-e="${CSS.escape(String(e.id))}"]`);if(x)x.textContent=etime(e)<=0?"DUE":fmt(etime(e))});(state.entities||[]).forEach(e=>(e.components||[]).filter(c=>c.kind==="timer").forEach(c=>{let x=document.querySelector(`[data-ent="${CSS.escape(String(e.id))}"][data-c="${CSS.escape(String(c.id))}"]`);if(x)x.textContent=fmt(ttime(c))}))},250);
</script></body></html><!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BattleClock — Party View v0.5</title>
