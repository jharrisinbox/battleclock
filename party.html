<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BattleClock — Party View</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#10141b;color:#eef3f8}main{width:min(720px,calc(100% - 32px));padding:28px;border:1px solid #303947;border-radius:16px;background:#171d26}h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.5rem)}.sub{color:#9ba8b7;margin-bottom:28px}.card{padding:22px;border:1px solid #354152;border-radius:12px;background:#111720}#message{font-size:1.35rem;font-weight:700}#status{margin-top:14px;color:#9ba8b7;font-size:.9rem}.ok{color:#8de5a1!important}.bad{color:#ff9b9b!important}</style>
</head><body><main><h1>BattleClock</h1><div class="sub">Party View · read only</div><section class="card"><div id="message">Connecting to BattleClock…</div><div id="status">Contacting Supabase</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ljqkmbngpdvgwfzgbmxp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_IwmRcJDgcBD40snvuUgN6g_Uct68Vvn";
const SESSION_ID="main";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const messageEl=document.getElementById("message"),statusEl=document.getElementById("status");
function showState(state){messageEl.textContent=state?.message||"BattleClock session is live."}
async function loadSession(){
 const {data,error}=await client.from("battleclock_sessions").select("public_state, updated_at").eq("session_id",SESSION_ID).single();
 if(error){console.error(error);messageEl.textContent="Could not load BattleClock.";statusEl.textContent=error.message;statusEl.className="bad";return}
 showState(data.public_state);statusEl.textContent="Connected · live updates enabled";statusEl.className="ok";
}
client.channel("battleclock-party-main").on("postgres_changes",{event:"UPDATE",schema:"public",table:"battleclock_sessions",filter:"session_id=eq."+SESSION_ID},payload=>{
 showState(payload.new.public_state);statusEl.textContent="Live · updated "+new Date().toLocaleTimeString();statusEl.className="ok";
}).subscribe(status=>{if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){statusEl.textContent="Loaded, but live update connection failed.";statusEl.className="bad"}});
loadSession();
</script></body></html>
